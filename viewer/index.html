<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corpusatlas graph viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; color: #c9d1d9;
    font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  #stage { position: absolute; inset: 0; }
  #hud { position: absolute; top: 12px; left: 12px; width: 260px;
    background: rgba(13,17,23,0.85); border: 1px solid #30363d; border-radius: 8px;
    padding: 10px 14px; }
  #hud p { margin: 4px 0; }
  #search { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 5px 8px;
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    color: #c9d1d9; font: inherit; }
  #search:focus { outline: 1px solid #58a6ff; }
  #searchResults { list-style: none; margin: 4px 0 0; padding: 0; max-height: 160px;
    overflow-y: auto; border-radius: 6px; overflow-x: hidden; }
  #searchResults li { padding: 4px 8px; font-size: 12.5px; cursor: pointer;
    border-top: 1px solid #21262d; }
  #searchResults li:first-child { border-top: none; }
  #searchResults li:hover { background: #21262d; }
  #legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; }
  #legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    cursor: pointer; }
  #legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #card { position: absolute; top: 12px; right: 12px; width: 280px; max-height: 80vh;
    overflow-y: auto; background: rgba(13,17,23,0.92); border: 1px solid #30363d;
    border-radius: 8px; padding: 12px 14px; display: none; }
  #card h3 { margin: 0 0 4px; font-size: 15px; }
  #card .type { color: #8b949e; font-size: 12px; margin-bottom: 8px; }
  #card ul { list-style: none; margin: 0; padding: 0; }
  #card li { padding: 3px 0; border-top: 1px solid #21262d; font-size: 12.5px; cursor: pointer; }
  #card li:first-child { border-top: none; }
  #card li:hover { color: #58a6ff; }
  a { color: #58a6ff; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">
  <p><strong>corpusatlas</strong> — reference viewer</p>
  <p id="status">loading…</p>
  <input id="search" type="search" placeholder="Find a node… (Esc to clear)" disabled>
  <ul id="searchResults" hidden></ul>
  <div id="legend"></div>
</div>
<div id="card"></div>

<!-- graphology and Sigma ship no ES-module browser build, so they load as
     classic UMD globals here; ForceAtlas2 ships no browser build at all and
     comes in as jsDelivr's +esm transform below, in the type="module" script
     that uses it. Same pairing shirokoff.ca's own renderer uses — proven
     versions, not arbitrary latest. -->
<script src="https://cdn.jsdelivr.net/npm/graphology@0.25.4/dist/graphology.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sigma@3.0.1/dist/sigma.min.js"></script>
<script type="module">
// A starting point, not a renderer to build on as-is: one static layout, no
// live simulation, no drag, no path-finding, no URL routing. The production
// renderer this was pulled from (shirokoff.ca/knowledge-base) is ~1900 lines
// for exactly those features — deliberately not reproduced here, because
// they were tuned for one specific graph's shape, not written to be generic.
// Label search and click-to-focus (dim everything but the selected node's
// neighbourhood, pan the camera there) are the one interaction this file
// does carry, since "find a node in a 1,000-node hairball" is a need every
// graph this renders will have, not something specific to one shape.
// Copy this file and grow it; it isn't meant to stay this small forever.
//
// Assumes graph.json sits next to this file — override with ?graph=<url>.
import forceAtlas2 from 'https://cdn.jsdelivr.net/npm/graphology-layout-forceatlas2@0.10.1/+esm';

const Graph = window.graphology.Graph || window.graphology;
const Sigma = window.Sigma.Sigma || window.Sigma;

const statusEl = document.getElementById('status');
const legendEl = document.getElementById('legend');
const cardEl = document.getElementById('card');
const searchEl = document.getElementById('search');
const resultsEl = document.getElementById('searchResults');

const params = new URLSearchParams(location.search);
const graphUrl = params.get('graph') || './graph.json';

// Deterministic colour per type from its name alone, so this works for any
// corpusatlas ontology without hard-coding type names — the moment
// ontology.py stops being fixed across every consumer (see the README),
// this still won't need an edit. Sigma's WebGL node program parses #rrggbb
// only, not arbitrary CSS colour syntax, so this returns hex, not hsl().
function colorFor(type) {
  let hash = 0;
  for (let i = 0; i < type.length; i++) hash = (hash * 31 + type.charCodeAt(i)) >>> 0;
  const h = hash % 360, s = 0.65, l = 0.6;
  const k = (n) => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const toHex = (n) => Math.round(f(n) * 255).toString(16).padStart(2, '0');
  return `#${toHex(0)}${toHex(8)}${toHex(4)}`;
}

let data;
try {
  data = await fetch(graphUrl).then((r) => {
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  });
} catch (err) {
  statusEl.textContent = `Could not load ${graphUrl}: ${err.message}`;
  throw err;
}

const entityTypes = new Set(data.entity_types || []);
// Entities only, same choice the production renderer makes: context nodes
// (articles, assessments — whatever a consumer's adapters produced) are
// evidence, not graph structure, and drawing both makes most graphs a
// hairball well before 1,000 nodes. Drop this filter to see everything.
const nodes = data.nodes.filter((n) => entityTypes.has(n.type));
const nodeIds = new Set(nodes.map((n) => n.id));
const edges = data.edges.filter((e) => nodeIds.has(e.src) && nodeIds.has(e.dst));

const g = new Graph({ multi: true });
const maxDegree = Math.max(1, ...nodes.map((n) => n.degree || 0));
for (const n of nodes) {
  g.addNode(n.id, {
    label: n.label,
    kind: n.type, // "type" is reserved by Sigma for choosing a node's render program
    size: 3 + 5 * Math.sqrt((n.degree || 0) / maxDegree),
    color: colorFor(n.type),
    x: Math.random(), y: Math.random(),
    meta: n,
  });
}
let dupes = 0;
for (const e of edges) {
  try {
    g.addEdge(e.src, e.dst, { rel: e.rel, size: 1, color: 'rgba(139,148,158,0.35)' });
  } catch (err) { dupes++; } // a second edge between the same pair — fine, just skip it
}

// Barnes-Hut trades a little layout precision for O(n log n) force
// calculation instead of O(n²) — negligible for a knowledge graph's visual
// layout, and the threshold used to be 2000, which meant a graph just
// under it paid full brute-force cost while a graph well over it didn't:
// measured, a 2,000-node graph (brute force) took ~8.5s and a 5,000-node
// one (Barnes-Hut) took ~12.2s — worse per node despite being 2.5x larger.
// 200 keeps brute force only for genuinely small graphs, where it finishes
// fast either way and the exactness doesn't matter.
forceAtlas2.assign(g, {
  iterations: 300,
  settings: { gravity: 1, scalingRatio: 8, strongGravityMode: true, barnesHutOptimize: g.order > 200 },
});

const renderer = new Sigma(g, document.getElementById('stage'), {
  labelRenderedSizeThreshold: 8,
  defaultDrawNodeHover: true,
});

// The one piece of interaction state this file has: which node (if any) is
// focused. The two reducers below are how Sigma dims everything outside its
// neighbourhood without touching the graph's own stored node/edge data.
let focusedNode = null;

renderer.setSetting('nodeReducer', (node, attrs) => {
  if (!focusedNode || node === focusedNode || g.areNeighbors(node, focusedNode)) return attrs;
  return { ...attrs, label: '', color: '#21262d', zIndex: 0 };
});
renderer.setSetting('edgeReducer', (edge, attrs) => {
  if (!focusedNode) return attrs;
  const [s, t] = g.extremities(edge);
  if (s === focusedNode || t === focusedNode) return attrs;
  return { ...attrs, color: 'rgba(48,54,61,0.12)' };
});

function focusNode(id) {
  focusedNode = id;
  renderer.refresh();

  const n = g.getNodeAttribute(id, 'meta');
  const neighbours = g.neighbors(id)
    .map((nid) => ({ id: nid, label: g.getNodeAttribute(nid, 'label') }))
    .sort((a, b) => a.label.localeCompare(b.label));
  cardEl.style.display = 'block';
  cardEl.innerHTML = `
    <h3>${n.label}</h3>
    <div class="type">${n.type} · degree ${n.degree || 0}</div>
    ${n.url ? `<p><a href="${n.url}" target="_blank" rel="noopener">source →</a></p>` : ''}
    <ul>${neighbours.slice(0, 25).map((nb) => `<li data-node="${nb.id}">${nb.label}</li>`).join('')}</ul>
    ${neighbours.length > 25 ? `<p>+${neighbours.length - 25} more</p>` : ''}
  `;
  // A neighbour in the card is itself a node in the graph — clicking it
  // refocuses there instead of making the reader find it by eye.
  for (const li of cardEl.querySelectorAll('li[data-node]')) {
    li.addEventListener('click', () => focusNode(li.dataset.node));
  }

  const pos = renderer.getNodeDisplayData(id);
  if (pos) renderer.getCamera().animate({ x: pos.x, y: pos.y }, { duration: 300 });
}

function clearFocus() {
  focusedNode = null;
  renderer.refresh();
  cardEl.style.display = 'none';
  searchEl.value = '';
  resultsEl.hidden = true;
  resultsEl.innerHTML = '';
}

renderer.on('clickNode', ({ node }) => focusNode(node));
renderer.on('clickStage', clearFocus);

searchEl.disabled = false;
searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  resultsEl.innerHTML = '';
  if (!q) { resultsEl.hidden = true; return; }
  const matches = nodes.filter((n) => n.label.toLowerCase().includes(q)).slice(0, 8);
  resultsEl.hidden = matches.length === 0;
  for (const m of matches) {
    const li = document.createElement('li');
    li.textContent = `${m.label} (${m.type})`;
    li.addEventListener('click', () => {
      focusNode(m.id);
      searchEl.value = m.label;
      resultsEl.hidden = true;
    });
    resultsEl.appendChild(li);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') clearFocus();
});

for (const type of [...entityTypes].sort()) {
  const span = document.createElement('span');
  span.innerHTML = `<i style="background:${colorFor(type)}"></i>${type}`;
  legendEl.appendChild(span);
}

statusEl.textContent = `${nodes.length} entities · ${edges.length - dupes} relationships` +
  (data.generated ? ` · built ${data.generated}` : '') + ' · click a node, or search above';
</script>
</body>
</html>
