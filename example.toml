# A worked example. Every path resolves relative to this file, so the config
# can live wherever the corpus does — this module does not care where it is
# installed from.

[[sources]]
type     = "html_blog"          # adapter name
path     = "../blog"            # a directory of rendered articles
url_base = "/blog/"             # what those articles are published under

[[sources]]
type = "radar_scorecards"
path = "../architecture-radar/scorecards.json"

[[sources]]
type = "radar_entries"
path = "../architecture-radar/radar.json"

[[sources]]
type     = "entity_packs"
path     = "entities"
url_base = "/knowledge-base/entities/"

# For a corpus that isn't a local checkout: a plain list of URLs, fetched at
# build time. Real network I/O, unlike every other adapter here — a build
# using this is only as reproducible as the pages it fetches, and fails if
# one is down rather than treating that as fatal for the whole build (a page
# that doesn't fetch is skipped with a warning, not a build failure). See
# corpusatlas/adapters/web.py for what its extraction can and can't do.
# [[sources]]
# type         = "web"
# urls         = ["https://example.org/docs/one", "https://example.org/docs/two"]
# url_list_file = "urls.txt"   # one URL per line, combined with `urls` above

[ontology]
entities = "entities.toml"      # the entity registry: named instances of the types below
# schema = "ontology.toml"      # optional; a custom vocabulary instead of DEFAULT's
                                 # data-and-infrastructure one — see docs/ontology-schema.md

# Packs cite their sources by URL; the graph joins on document id. These say
# how to get from one to the other. The defaults are the values below minus
# site_url, so a corpus published at /blog/ needs none of this.
[packs]
site_url             = "https://example.org"   # optional; stripped from absolute URLs
blog_prefix          = "/blog/"
assessment_prefix    = "/architecture-radar/"
assessment_id_prefix = "assessment:"
