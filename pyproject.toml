[project]
name = "corpusatlas"
version = "0.7.0"
description = "Build a knowledge graph from a markdown/HTML corpus and ship it as a static file."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dmitry Shirokov", email = "dmansh@gmail.com" }]
keywords = ["knowledge-graph", "static-site", "ontology", "graph", "provenance"]
dependencies = []

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://shirokoff.ca/blog/build-time-knowledge-graph"
Source = "https://github.com/anothernoise/corpusatlas"

[project.scripts]
corpusatlas = "corpusatlas.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["corpusatlas*"]

[tool.setuptools.package-data]
# The marker PEP 561 requires for the "Typing :: Typed" classifier above to
# mean anything to mypy/pyright — without it an installed copy is silently
# treated as untyped by any consumer, classifier notwithstanding.
corpusatlas = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
