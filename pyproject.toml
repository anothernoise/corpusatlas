[project]
name = "corpusgraph"
version = "0.1.0"
description = "Build a knowledge graph from a markdown/HTML corpus and ship it as a static file."
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.scripts]
corpusgraph = "corpusgraph.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
