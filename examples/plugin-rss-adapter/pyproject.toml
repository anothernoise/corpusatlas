[project]
name = "corpusatlas-rss"
version = "0.1.0"
description = "Example third-party corpusatlas source adapter: a local RSS/Atom feed file."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["corpusatlas"]

# The whole mechanism this example exists to demonstrate: once this package
# is installed alongside corpusatlas, `[[sources]] type = "rss"` in any
# corpusatlas.toml resolves to RssAdapter — no change to corpusatlas
# itself. See corpusatlas/adapters/__init__.py and docs/adapters.md.
[project.entry-points."corpusatlas.adapters"]
rss = "corpusatlas_rss.adapter:RssAdapter"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["corpusatlas_rss*"]
