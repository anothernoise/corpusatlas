# Cuts the GitHub Release itself once a version tag is pushed — the part of
# releasing this project had been doing by hand every time (copy the
# matching CHANGELOG.md section into `gh release create --notes`, retyped
# fresh each release). The tag and the CHANGELOG entry are still a human
# decision, made the normal way: bump __init__.py/pyproject.toml, add a
# dated section to CHANGELOG.md, commit, `git tag vX.Y.Z && git push --tags`.
# This workflow only reacts to that tag landing.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract this version's CHANGELOG section
        id: notes
        run: |
          python3 - <<'PY'
          import re
          import os

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # Everything between this version's own "## [X.Y.Z] — date" header
          # and the next "## [" header (or end of file).
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, text, re.S | re.M)
          notes = m.group(1).strip() if m else (
              f"No CHANGELOG.md section found for {version} — see the commit history."
          )
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release_notes.md

  pypi-publish:
    name: Publish to PyPI
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python3 -m pip install --upgrade pip build

      - name: Build distribution packages
        run: python3 -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
