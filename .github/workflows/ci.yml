# The module has no runtime dependencies and its tests carry their own
# fixtures, so this is the whole gate: it installs, the console script is
# wired, and the pipeline holds its invariants on every supported Python —
# and, since path handling is exactly the kind of thing that looks fine on
# one platform and isn't, on Windows too.
#
# Building a real corpus — with real source paths and a real entity registry —
# is the consuming repo's job, not this one's.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows failure shouldn't cancel the rest of the matrix mid-run —
      # this is the platform least tested locally, so seeing every result
      # matters more here than it would for a routine version bump.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (no runtime deps by design)
        run: python -m pip install -e .

      - name: Console script is wired
        run: corpusatlas --help

      - name: Tests
        # tests/ carries self-contained fixtures and exercises the full
        # adapters -> extract -> merge -> emit pipeline. Building an actual
        # corpus (with real source paths) is the *consuming* repo's CI job,
        # not the library's — see README.
        run: python tests/run.py

      # Coverage is a CI-only dev tool, not a runtime dependency — measured
      # once, not on every combination in the matrix, since the number
      # itself doesn't meaningfully vary by platform or Python version.
      # 85% is comfortably below the measured ~92% on the day this was
      # added, not the number itself — headroom for normal changes, while
      # still catching something landing with no tests at all.
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install -q coverage
          python -m coverage run --source=corpusatlas tests/run.py
          python -m coverage report -m --fail-under=85
